<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(/_kaynak/font/Fraunces-SemiBold.ttf);font-weight:600}
@font-face{font-family:Fraunces;src:url(/_kaynak/font/Fraunces-Italic.ttf);font-style:italic}
@font-face{font-family:Fraunces;src:url(/_kaynak/font/Fraunces-Medium.ttf);font-weight:500}
@font-face{font-family:"Crimson Pro";src:url(/_kaynak/font/CrimsonPro-Italic.ttf);font-style:italic}
html,body{margin:0;width:1200px;height:630px;background:#F2EBE0;color:#262028;overflow:hidden}
.k{position:absolute;inset:26px;border:2px solid #d8ccbb}
.bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:#B3263A}
.marka{position:absolute;left:64px;top:62px;font:600 28px Fraunces;letter-spacing:.06em;display:flex;align-items:center;gap:14px}
.marka img{width:60px;height:60px;border-radius:50%}
.marka small{display:block;font:500 17px Fraunces;color:#6b6070;letter-spacing:.12em}
h1{position:absolute;left:64px;top:190px;width:560px;margin:0;font:600 82px/1 Fraunces;letter-spacing:-.01em}
p{position:absolute;left:64px;top:410px;width:540px;margin:0;font:italic 400 32px/1.25 "Crimson Pro";color:#6b6070}
.url{position:absolute;left:64px;bottom:56px;font:500 26px Fraunces;color:#B3263A}
.res{position:absolute;right:60px;top:90px;width:520px;height:430px;background:#fbf5ea;border:2px solid #d8ccbb;display:grid;place-items:center}
.res svg{width:100%;height:100%}
</style></head><body>
<div class="k"></div><div class="marka"><img src="/img/simge.png"><div>AŞKONOMİ<small>OYUNLAR</small></div></div>
<h1 id="b"></h1><p id="a"></p><div class="url" id="u"></div><div class="res" id="r"></div><div class="bar"></div>
<script src="/oyunlar/ortak.js"></script>
<script>
var q=new URLSearchParams(location.search), s=q.get('s'), o=OYUN.OYUNLAR.find(x=>x.slug===s);
if(s==='merkez'){document.getElementById('b').innerHTML='Oyunlar<br><i style="font-weight:400;color:#B3263A">kalbin hesabıyla</i>';document.getElementById('a').textContent='Güven oyunu, eşleşme köyü, beklenti bütçesi, kaydırma simülatörü ve Türkiye’nin aşk haritası.';document.getElementById('u').textContent='askonomi.com/oyunlar';document.getElementById('r').innerHTML=OYUN.C.guven;}
else{document.getElementById('b').textContent=o.ad;document.getElementById('a').textContent=o.kisa;document.getElementById('u').textContent='askonomi.com/oyunlar/'+s;document.getElementById('r').innerHTML=OYUN.C[o.cizim];}
</script></body></html>
